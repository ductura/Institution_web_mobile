name: CI

on:
  push:
    branches: [main, migracija/nextjs]
  pull_request:
    branches: [main, migracija/nextjs]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Install pnpm (Node 26 has no corepack)
        run: npm install --global pnpm@12.21.0 && test "$(pnpm --version)" = "12.21.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Testovi pomoćnih funkcija i BFF-a
        run: pnpm test:helpers
      - run: pnpm build
      - name: Instalacija preglednika
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Funkcionalni testovi (Android, iPhone, iPad)
        run: pnpm test:functional
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-report, path: test-results/ }

  secret-scan:
    uses: ductura/.github/.github/workflows/secret-scan.yml@97c31e9178438ef0d7e663a609cea1b459a3e3aa # main

  # Compares what the PR changes against the advisory database; nothing to
  # compare on push, so it runs only for pull requests (ci-ok allows that skip).
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ductura/.github/.github/workflows/dependency-review.yml@97c31e9178438ef0d7e663a609cea1b459a3e3aa # main

  # Single required check for branch protection: green only when every job above
  # succeeded (failure, cancellation and skips all make it red).
  ci-ok:
    if: ${{ always() }}
    needs: [test, secret-scan, dependency-review]
    uses: ductura/.github/.github/workflows/ci-ok.yml@97c31e9178438ef0d7e663a609cea1b459a3e3aa # main
    with:
      results: ${{ toJSON(needs) }}
      allow-skipped: dependency-review
