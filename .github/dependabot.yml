version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Versions in package.json are exact; @ductura/* are pinned to a commit or
    # a release tarball and are bumped by hand together with their source repo.
    ignore:
      - dependency-name: "@ductura/*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
